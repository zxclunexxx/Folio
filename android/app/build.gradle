plugins { id 'com.android.application' }
android {
    namespace 'com.lunex.folio'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lunex.folio'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs = ['build/generated/folioAssets'] } }
    buildTypes { release { minifyEnabled false } }
}
tasks.register('syncWebAssets', Copy) { from('../../web'); into('build/generated/folioAssets/www') }
tasks.named('preBuild').configure { dependsOn('syncWebAssets') }
