 if(!d||d.version!==1||!d.profile||!Array.isArray(d.projects)||!Array.isArray(d.tasks)||!Array.isArray(d.payments))throw Error('Это не резервная копия Folio v1.');

 for(const p of d.projects)if(!id(p.id)||!text(p.name,80,false)||!text(p.client,60)||!cash(p.budget)||!(p.deadline===''||validDate(p.deadline))||!Object.prototype.hasOwnProperty.call(categories,p.category)||!Object.prototype.hasOwnProperty.call(statuses,p.status)||!text(p.notes,2000)||!validDate(p.created))throw Error('В копии некорректный проект.');
 const ps=new Set(d.projects.map(p=>p.id));
 for(const t of d.tasks)if(!id(t.id)||!text(t.title,160,false)||!text(t.project,80)||!(t.project===''||ps.has(t.project))||!(t.due===''||validDate(t.due))||!Object.prototype.hasOwnProperty.call(priorities,t.priority)||typeof t.done!=='boolean')throw Error('В копии некорректная задача.');
 for(const p of d.payments)if(!id(p.id)||!text(p.project,80)||!(p.project===''||ps.has(p.project))||!text(p.projectName,80)||!cash(p.amount)||p.amount<=0||!validDate(p.date)||!text(p.note,200))throw Error('В копии некорректный платёж.');
 for(const a of [d.projects,d.tasks,d.payments])if(new Set(a.map(x=>x.id)).size!==a.length)throw Error('В копии повторяются идентификаторы.');
 // Select known properties: no executable content or prototype merging.
 return {version:1,demo:d.demo,profile:{name:d.profile.name.trim(),goal:d.profile.goal,theme:d.profile.theme},projects:d.projects.map(p=>({id:p.id,name:p.name.trim(),client:p.client,budget:p.budget,deadline:p.deadline,category:p.category,status:p.status,notes:p.notes,created:p.created})),tasks:d.tasks.map(t=>({id:t.id,title:t.title.trim(),project:t.project,due:t.due,priority:t.priority,done:t.done})),payments:d.payments.map(p=>({id:p.id,project:p.project,projectName:p.projectName,amount:p.amount,date:p.date,note:p.note}))};

function load(){
 try{const raw=localStorage.getItem(KEY);if(raw){state=validate(JSON.parse(raw));}else{state=seed();localStorage.setItem(KEY,JSON.stringify(state));}}
 catch(e){state=seed();recovery=true;}
}
function save(){
 if(recovery){toast('Сначала сохраните или сбросьте повреждённые данные в настройках.',true);return false;}
 try{const s=JSON.stringify(state);if(s.length>MAX)throw Error();localStorage.setItem(KEY,s);saveFailed=false;return true;}
 catch(e){saveFailed=true;toast('Не удалось сохранить. Освободите память или экспортируйте данные.',true);return false;}
}
function commit(fn,message){
 const before=JSON.stringify(state);fn();if(!save()){state=JSON.parse(before);render();return false;}if(message)toast(message);return true;
}

function projectOptions(current){return options(Object.fromEntries(state.projects.map(p=>[p.id,p.name])),current,'Без проекта');}
function field(name,label,value='',type='text',extra=''){return `<label class="field"><span>${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function projectForm(p){return `<form id="project-form"><input type="hidden" name="id" value="${p?.id||''}">${field('name','Название проекта',p?.name||'','text','required maxlength="80" placeholder="Например, сайт студии"')}${field('client','Клиент',p?.client||'','text','maxlength="60" placeholder="Компания или имя"')}<div class="form-grid">${field('budget','Бюджет, ₽',p?.budget??'','number','min="0" max="999999999" step="0.01" required placeholder="0" inputmode="decimal"')}${field('deadline','Дедлайн',p?.deadline||'','date','min="2000-01-01" max="2100-12-31"')}</div><div class="form-grid"><label class="field"><span>Направление</span><select name="category">${options(Object.fromEntries(Object.entries(categories).map(([k,v])=>[k,v.label])),p?.category||'design')}</select></label><label class="field"><span>Статус</span><select name="status">${options(statuses,p?.status||'active')}</select></label></div><label class="field"><span>Заметки</span><textarea name="notes" maxlength="2000" placeholder="Что важно не забыть">${esc(p?.notes||'')}</textarea></label><div class="form-actions">${p?`<button type="button" class="btn ghost" data-action="delete-project" data-id="${p.id}" aria-label="Удалить проект">${i('trash')}</button>`:''}<button type="submit" class="btn">${i('check')}${p?'Сохранить изменения':'Создать проект'}</button></div><p class="form-help">Бюджет — ожидаемая сумма. Фактические поступления записываются отдельно.</p></form>`;}
function taskForm(t,project){return `<form id="task-form"><input type="hidden" name="id" value="${t?.id||''}">${field('title','Что нужно сделать?',t?.title||'','text','required maxlength="160" placeholder="Один понятный шаг"')}<label class="field"><span>Проект</span><select name="project">${projectOptions(t?.project||project||'')}</select></label><div class="form-grid">${field('due','Срок',t?t.due:day(),'date','min="2000-01-01" max="2100-12-31"')}<label class="field"><span>Приоритет</span><select name="priority">${options(priorities,t?.priority||'normal')}</select></label></div><div class="form-actions">${t?`<button type="button" class="btn ghost" data-action="delete-task" data-id="${t.id}" aria-label="Удалить задачу">${i('trash')}</button>`:''}<button type="submit" class="btn">${i('check')}${t?'Сохранить':'Добавить задачу'}</button></div></form>`;}
function paymentForm(p,project){return `<form id="payment-form"><input type="hidden" name="id" value="${p?.id||''}">${field('amount','Полученная сумма, ₽',p?.amount??'','number','required min="0.01" max="999999999" step="0.01" placeholder="0" inputmode="decimal"')}<label class="field"><span>Проект</span><select name="project">${projectOptions(p?.project||project||'')}</select></label>${field('date','Дата поступления',p?.date||day(),'date','required min="2000-01-01" max="'+day()+'"')}${field('note','Комментарий',p?.note||'','text','maxlength="200" placeholder="Например, предоплата 50%"')}<div class="form-actions">${p?`<button type="button" class="btn ghost" data-action="delete-payment" data-id="${p.id}" aria-label="Удалить платёж">${i('trash')}</button>`:''}<button type="submit" class="btn">${i('check')}${p?'Сохранить':'Записать доход'}</button></div><p class="form-help">Добавляйте только уже полученные деньги. Folio не проводит банковские операции.</p></form>`;}
function settings(){return `<div class="settings-section"><div class="eyebrow">Личное пространство</div><button class="settings-row" data-action="profile">${i('edit')}<span><b>${esc(state.profile.name)}</b><small>Имя и месячная цель</small></span>${i('chevron')}</button><div class="theme-picker">${[['light','Светлая'],['dark','Тёмная'],['system','Система']].map(([key,label])=>`<button class="chip ${state.profile.theme===key?'active':''}" data-action="theme" data-theme="${key}" aria-pressed="${state.profile.theme===key}">${label}</button>`).join('')}</div></div><div class="settings-section"><div class="eyebrow">Мои данные</div><button class="settings-row" data-action="export">${i('download')}<span><b>Резервная копия</b><small>Сохранить проекты, задачи и платежи</small></span>${i('chevron')}</button><button class="settings-row" data-action="import">${i('upload')}<span><b>Восстановить из копии</b><small>Заменить данные сохранённой копией</small></span>${i('chevron')}</button>${installPrompt?`<button class="settings-row" data-action="install">${i('phone')}<span><b>Установить Folio</b><small>Добавить приложение на главный экран</small></span>${i('chevron')}</button>`:''}</div><div class="settings-section"><div class="eyebrow">Начать по-своему</div><button class="settings-row" data-action="demo">${i('spark')}<span><b>Загрузить демо-проекты</b><small>Заменит текущие данные примерами</small></span>${i('chevron')}</button><button class="settings-row danger" data-action="reset">${i('trash')}<span><b>Очистить проекты и доходы</b><small>Начать с пустого рабочего пространства</small></span>${i('chevron')}</button></div><div class="info-box">${i('shield','icon-sm')} Никаких аккаунтов и аналитики. Данные хранятся локально. При удалении приложения или очистке данных браузера они удалятся — сохраняйте резервную копию.</div><div class="version">folio. · версия 1.0.0<br>Проекты. Задачи. Спокойствие.<br>Иконки: Font Awesome Free · CC BY 4.0</div>`;}
let confirmation=null;
function ask(title,text,fn){confirmation=fn;openModal('confirm',{title,text},!!ui.modal);}
function renderModal(){
 const root=$('#modal-root');if(!ui.modal){root.innerHTML='';document.body.style.overflow='';return;}document.body.style.overflow='hidden';const d=ui.modalData||{};let title='',body='';
 if(ui.modal==='project-form'){const p=d.id?getProject(d.id):null;title=p?'Изменить проект':'Новая глава.';body=projectForm(p);}
 if(ui.modal==='task-form'){const t=state.tasks.find(x=>x.id===d.id);title=t?'Изменить задачу':'Маленький шаг.';body=taskForm(t,d.project);}
 if(ui.modal==='payment-form'){const p=state.payments.find(x=>x.id===d.id);title=p?'Изменить платёж':'Хорошие новости.';body=paymentForm(p,d.project);}
 if(ui.modal==='settings'){title='Твоё пространство.';body=settings();}
 if(ui.modal==='profile'){title='Знакомство с тобой.';body=`<form id="profile-form">${field('name','Как тебя зовут?',state.profile.name,'text','required maxlength="40"')}${field('goal','Цель дохода на месяц, ₽',state.profile.goal,'number','required min="1" max="999999999" step="1" inputmode="numeric"')}<button class="btn full" type="submit">Сохранить</button><p class="form-help">Цель применяется к отображению всех месяцев. Валюта учёта — российский рубль.</p></form>`;}
 if(ui.modal==='confirm'){title=esc(d.title);body=`<p class="confirm-text">${esc(d.text)}</p><div class="form-actions"><button class="btn ghost" data-action="close">Отмена</button><button class="btn danger" data-action="confirm">Подтвердить</button></div>`;}
 if(ui.modal==='export'){title='Пусть всё сохранится.';const raw=recovery?(localStorage.getItem(KEY)||''):JSON.stringify(state,null,2);body=`<p class="form-help" style="margin:0 0 15px">${recovery?'Исходное сохранение не удалось прочитать. Скопируйте его, прежде чем восстанавливать данные.':'Скопируйте текст целиком в файл или сохраните JSON. Копия содержит все ваши данные; храните её в безопасном месте.'}</p><textarea id="backup-text" class="field backup-field" readonly style="width:100%;padding:12px;background:var(--paper);color:var(--text);border:1px solid var(--line);border-radius:12px">${esc(raw)}</textarea><div class="form-actions"><button class="btn" data-action="copy">${i('copy')}Скопировать</button>${isNative()?'':`<button class="btn secondary" data-action="download">${i('download')}JSON</button>`}</div>${isNative()?'<p class="form-help">На Android нажмите «Скопировать» и вставьте текст в заметки или сохраните его в текстовый файл.</p>':''}`;}
 if(ui.modal==='import'){title='Всё на своих местах.';body=`<p class="form-help" style="margin:0 0 15px">Вставьте текст копии Folio. После проверки приложение попросит подтвердить замену текущих данных.</p>${isNative()?'':'<label class="field"><span>Или выберите JSON-файл</span><input id="import-file" type="file" accept=".json,application/json"></label>'}<label class="field"><span>Текст резервной копии</span><textarea id="import-text" class="backup-field" placeholder=\'{"version":1,...}\' spellcheck="false"></textarea></label><button class="btn full" data-action="check-import">Проверить и восстановить</button>`;}
 root.innerHTML=`<div class="backdrop" data-backdrop="true"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="handle"></div><div class="sheet-head"><h2 id="sheet-title">${title}</h2><button class="icon-btn" data-action="close" aria-label="Закрыть">${i('close')}</button></div>${body}</section></div>`;
 // Avoid opening the keyboard automatically on touch devices.
 if(matchMedia('(pointer:fine)').matches)setTimeout(()=>root.querySelector('input:not([type=hidden]),button')?.focus(),70);
}
function isNative(){return /; wv\)/.test(navigator.userAgent)||location.protocol==='file:'&&/Android/i.test(navigator.userAgent);}
function deleteEntity(type,id){const names={project:['Удалить проект?','Задачи проекта будут удалены. Уже записанные поступления останутся в истории доходов без привязки к проекту.'],task:['Удалить задачу?','Это действие нельзя отменить.'],payment:['Удалить платёж?','Он исчезнет из истории и больше не будет учитываться в доходах.']};ask(...names[type],()=>{if(commit(()=>{if(type==='project'){const p=getProject(id);state.projects=state.projects.filter(x=>x.id!==id);state.tasks=state.tasks.filter(x=>x.project!==id);state.payments=state.payments.map(r=>r.project===id?{...r,project:'',projectName:p?.name||r.projectName}:r);ui.project=null;}else if(type==='task'){state.tasks=state.tasks.filter(x=>x.id!==id);}else{state.payments=state.payments.filter(x=>x.id!==id);}},'Удалено')){closeModal();render();}});}
function parseBackup(raw){if(raw.length>MAX)throw Error('Файл слишком большой. Максимум 2,5 МБ.');return validate(JSON.parse(raw));}
function downloadBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`folio-backup-${day()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function onAction(el){const a=el.dataset.action,id=el.dataset.id;
 switch(a){
 case 'tab':navigate(el.dataset.tab);break;
 case 'project':navigate('projects',id);break;
 case 'back-projects':navigate('projects');break;
 case 'project-filter':ui.projectFilter=el.dataset.filter;render();break;
 case 'task-filter':ui.taskFilter=el.dataset.filter;render();break;
 case 'new-project':openModal('project-form');break;
 case 'edit-project':openModal('project-form',{id});break;
 case 'new-task':openModal('task-form',{project:el.dataset.project||ui.project||''});break;
 case 'edit-task':openModal('task-form',{id});break;
 case 'new-payment':openModal('payment-form',{project:el.dataset.project||ui.project||''});break;
 case 'edit-payment':openModal('payment-form',{id});break;
 case 'toggle-task':if(commit(()=>{const t=state.tasks.find(t=>t.id===id);if(t)t.done=!t.done;})){render();}break;
 case 'delete-project':deleteEntity('project',id);break;
 case 'delete-task':deleteEntity('task',id);break;
 case 'delete-payment':deleteEntity('payment',id);break;
 case 'settings':openModal('settings',null,!!ui.modal);break;
 case 'profile':openModal('profile',null,!!ui.modal);break;
 case 'theme':if(commit(()=>state.profile.theme=el.dataset.theme)){applyTheme();renderModal();}break;
 case 'close':closeModal();break;
 case 'month':{const d=parseDate(ui.month+'-01');d.setMonth(d.getMonth()+Number(el.dataset.delta));ui.month=monthKey(d);render();break;}
 case 'confirm':{const fn=confirmation;confirmation=null;if(fn)fn();else closeModal();break;}
 case 'export':openModal('export',null,!!ui.modal);break;
 case 'import':openModal('import',null,!!ui.modal);break;
 case 'download':downloadBackup();break;
 case 'copy':{const text=$('#backup-text');text.focus();text.select();try{if(document.execCommand('copy'))toast('Копия в буфере обмена');else if(navigator.clipboard){navigator.clipboard.writeText(text.value).then(()=>toast('Копия в буфере обмена')).catch(()=>toast('Выделите текст и скопируйте его вручную.',true));}else toast('Текст выделен. Нажмите «Копировать».');}catch(e){toast('Текст выделен. Скопируйте его вручную.');}break;}
 case 'check-import':{try{const next=parseBackup($('#import-text').value);ask('Восстановить копию?',`Текущие данные заменятся: ${next.projects.length} проектов, ${next.tasks.length} задач, ${next.payments.length} платежей. Предварительно сохраните свою копию.`,()=>{const old=state,wasRecovery=recovery;state=next;recovery=false;if(save()){ui.project=null;closeModal();render();toast('Резервная копия восстановлена');}else{state=old;recovery=wasRecovery;render();}});}catch(e){toast(e instanceof SyntaxError?'Некорректный JSON. Вставьте текст копии целиком.':e.message,true);}break;}
 case 'reset':ask('Начать с чистого листа?','Все проекты, задачи и платежи на этом устройстве будут удалены. Сначала сохраните резервную копию. Имя, тема и месячная цель останутся.',()=>{const prev=state,wasRecovery=recovery;state={version:1,demo:false,profile:{...state.profile},projects:[],tasks:[],payments:[]};recovery=false;if(save()){ui.project=null;closeModal();render();toast('Готово. Это ваше пространство.');}else{state=prev;recovery=wasRecovery;render();}});break;
 case 'demo':ask('Загрузить примеры?','Текущие проекты, задачи и доходы заменятся демонстрационными. Сохраните резервную копию перед продолжением.',()=>{const prev=state,wasRecovery=recovery;state=seed();recovery=false;if(save()){ui.project=null;closeModal();render();toast('Демо-проекты загружены');}else{state=prev;recovery=wasRecovery;render();}});break;
 case 'install':if(installPrompt){installPrompt.prompt();installPrompt.userChoice.then(()=>{installPrompt=null;renderModal();});}break;
 }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();onAction(el);}else if(e.target.dataset.backdrop){closeModal();}});
document.addEventListener('input',e=>{if(e.target.id==='project-search'){const pos=e.target.selectionStart;ui.query=e.target.value;const temp=document.createElement('div');temp.innerHTML=projectsPage();$('#project-results').innerHTML=temp.querySelector('#project-results').innerHTML;}});
document.addEventListener('change',async e=>{if(e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;if(file.size>MAX){toast('Файл больше 2,5 МБ.',true);return;}try{$('#import-text').value=await file.text();}catch(err){toast('Не удалось прочитать файл.',true);}}});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,fid=f.getAttribute('id');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));let message='';
 if(fid==='project-form'){
  if(!d.name.trim()){toast('Введите название проекта.',true);return;}
  if(d.deadline&&!validDate(d.deadline)){toast('Проверьте дедлайн.',true);return;}
  const p={id:d.id||uid(),name:d.name.trim(),client:d.client.trim(),budget:Math.round(Number(d.budget)*100)/100,deadline:d.deadline,category:d.category,status:d.status,notes:d.notes.trim(),created:getProject(d.id)?.created||day()};
  message=d.id?'Проект обновлён':'Новая глава началась';if(!commit(()=>{const index=state.projects.findIndex(x=>x.id===d.id);if(index>=0)state.projects[index]=p;else state.projects.unshift(p);},message))return;
 }else if(fid==='task-form'){
  if(!d.title.trim()){toast('Введите название задачи.',true);return;}
  const t={id:d.id||uid(),title:d.title.trim(),project:d.project,due:d.due,priority:d.priority,done:state.tasks.find(x=>x.id===d.id)?.done||false};
  if(!commit(()=>{const index=state.tasks.findIndex(x=>x.id===d.id);if(index>=0)state.tasks[index]=t;else state.tasks.push(t);},d.id?'Задача обновлена':'Задача добавлена'))return;
 }else if(fid==='payment-form'){
  if(!validDate(d.date)||d.date>day()){toast('Укажите дату уже полученного платежа.',true);return;}
  const p={id:d.id||uid(),project:d.project,projectName:getProject(d.project)?.name||state.payments.find(x=>x.id===d.id)?.projectName||'',amount:Math.round(Number(d.amount)*100)/100,date:d.date,note:d.note.trim()};
  if(!commit(()=>{const index=state.payments.findIndex(x=>x.id===d.id);if(index>=0)state.payments[index]=p;else state.payments.unshift(p);},d.id?'Платёж обновлён':'Доход записан. Отличная работа!'))return;
 }else if(fid==='profile-form'){
  if(!d.name.trim()){toast('Введите имя.',true);return;}
  if(!commit(()=>{state.profile.name=d.name.trim();state.profile.goal=Number(d.goal);},'Настройки сохранены'))return;
 }else return;
 closeModal();render();
});
window.addEventListener('popstate',e=>{const s=e.state||{tab:'home'};ui.tab=['home','projects','tasks','income'].includes(s.tab)?s.tab:'home';ui.project=s.project||null;ui.modal=s.modal||null;ui.modalData=s.modalData||null;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){e.preventDefault();closeModal();}if(e.key==='Tab'&&ui.modal){const els=[...$('#modal-root').querySelectorAll('button,input:not([type=hidden]),select,textarea,a[href]')].filter(x=>!x.disabled);if(!els.length)return;const a=els[0],z=els[els.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{state=validate(JSON.parse(e.newValue));if(!ui.modal)render();}catch(err){toast('Данные изменились в другой вкладке, но не прошли проверку.',true);}}});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state.profile.theme==='system')applyTheme();});
load();history.replaceState({tab:'home'},'','#home');render();
// Single-file preview: service worker intentionally omitted.
// Read-only diagnostics and validator are useful for automated tests and debugging.
window.Folio={version:'1.0.0',validateBackup:validate,snapshot:()=>JSON.parse(JSON.stringify(state)),storageKey:KEY};
})();
</script>
</body></html>
